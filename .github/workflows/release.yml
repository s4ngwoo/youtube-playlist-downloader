name: Release App

on:
  push:
    tags:
      - 'v*'

# Sidecar policy: yt-dlp "latest" by default; FFmpeg is LGPL (see docs/RELEASING.md).
# Pin with YTDLP_TAG / FFMPEG_TAG when needed.
env:
  YTDLP_TAG: latest
  FFMPEG_TAG: n7.1.1

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            rust_target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            sidecar_name: 'yt-dlp-aarch64-apple-darwin'
            sidecar_asset: 'yt-dlp_macos'
            ffmpeg_triple: 'aarch64-apple-darwin'
          # Intel Mac: native x86_64 runner so LGPL FFmpeg builds without cross-compile.
          - platform: 'macos-13'
            rust_target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            sidecar_name: 'yt-dlp-x86_64-apple-darwin'
            sidecar_asset: 'yt-dlp_macos'
            ffmpeg_triple: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            rust_target: ''
            args: ''
            sidecar_name: 'yt-dlp-x86_64-pc-windows-msvc.exe'
            sidecar_asset: 'yt-dlp.exe'
            ffmpeg_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Empty targets on Windows = host toolchain only.
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm install

      # Tauri 사이드카(yt-dlp) OS·아키텍처별 바이너리 자동 준비
      - name: Download yt-dlp sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          TAG="${YTDLP_TAG}"
          if [ "$TAG" = "latest" ]; then
            BASE="https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          else
            BASE="https://github.com/yt-dlp/yt-dlp/releases/download/${TAG}"
          fi
          curl -fsSL "${BASE}/${{ matrix.sidecar_asset }}" -o "src-tauri/bin/${{ matrix.sidecar_name }}"
          if [[ "${{ matrix.sidecar_name }}" != *.exe ]]; then
            chmod +x "src-tauri/bin/${{ matrix.sidecar_name }}"
          fi
          echo "Bundled sidecar: ${{ matrix.sidecar_name }} (yt-dlp tag=${TAG}, asset=${{ matrix.sidecar_asset }})"

      - name: Prepare LGPL FFmpeg sidecars
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.ffmpeg_triple }}
          FFMPEG_TAG: ${{ env.FFMPEG_TAG }}
        run: |
          bash scripts/prepare-ffmpeg-sidecar.sh
          ls -lh src-tauri/bin/ffmpeg-* src-tauri/bin/ffprobe-* || true

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YouTube Playlist & Audio Downloader ${{ github.ref_name }}'
          releaseBody: |
            ### YouTube Playlist & Audio Downloader ${{ github.ref_name }}

            #### Supported platforms
            - **macOS (Apple Silicon: M1 / M2 / M3 / M4)**: download `*_aarch64.dmg`
            - **macOS (Intel x86_64)**: download `*_x64.dmg` / `*_x86_64.dmg`
            - **Windows (x64)**: download `*-setup.exe` / `*.msi`

            #### Bundled tools
            - **yt-dlp** sidecar (in-app update writes an app-data override)
            - **FFmpeg / ffprobe** (LGPL) — no separate system install required
            - **Deno** remains optional (system install recommended for JS challenges)

            #### First launch on macOS (unidentified developer)
            1. Open the `.dmg` and drag the app into Applications.
            2. In Applications, right-click (or Control-click) the app → Open → confirm Open.
            3. Or use System Settings → Privacy & Security → Open Anyway.

            #### First launch on Windows (SmartScreen)
            If SmartScreen appears: More info → Run anyway.

            Linux official binaries are not planned (build from source / use yt-dlp CLI).
            Release process / sidecars: see docs/RELEASING.md · Third-party: docs/THIRD_PARTY.md
            Docs: https://github.com/s4ngwoo/youtube-playlist-downloader#readme
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
