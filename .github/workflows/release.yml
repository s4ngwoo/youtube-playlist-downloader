name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Tauri 사이드카(yt-dlp) OS별 바이너리 자동 준비
      - name: Download yt-dlp sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-aarch64-apple-darwin
            chmod +x src-tauri/bin/yt-dlp-aarch64-apple-darwin
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe
          fi

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseBody: |
            ### 🎵 YouTube Playlist & Audio Downloader ${{ github.ref_name }}

            #### 🍏 지원 환경 (Supported Platforms)
            - **macOS (Apple Silicon: M1 / M2 / M3 / M4)**: `Youtube.Playlist.Downloader_*_aarch64.dmg` 다운로드
            - *(Windows 및 Intel Mac용 빌드는 현재 패키징 준비 중입니다)*

            #### 💡 macOS 첫 실행 시 ("확인되지 않은 개발자" 해결법)
            1. 다운로드한 `.dmg` 파일을 열고 앱을 `Applications`로 드래그합니다.
            2. 응용 프로그램 폴더에서 앱을 **마우스 우클릭 -> [열기]** 클릭 후 팝업에서 **[열기]**를 선택합니다.
            3. 또는 **시스템 설정 -> 개인정보 보호 및 보안 -> '확인 없이 열기'**를 클릭합니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
