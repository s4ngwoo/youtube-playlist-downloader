name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # Tauri 사이드카(yt-dlp) OS별 바이너리 자동 준비
      - name: Download yt-dlp sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-aarch64-apple-darwin
            chmod +x src-tauri/bin/yt-dlp-aarch64-apple-darwin
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe
          fi

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseBody: |
            ### YouTube Playlist & Audio Downloader ${{ github.ref_name }}

            #### Supported platforms
            - **macOS (Apple Silicon: M1 / M2 / M3 / M4)**: download `*_aarch64.dmg`
            - **Windows (x64)**: download `*-setup.exe` / `*.msi`

            #### First launch on macOS (unidentified developer)
            1. Open the `.dmg` and drag the app into Applications.
            2. In Applications, right-click (or Control-click) the app → Open → confirm Open.
            3. Or use System Settings → Privacy & Security → Open Anyway.

            #### First launch on Windows (SmartScreen)
            If SmartScreen appears: More info → Run anyway.

            Intel Mac and Linux official binaries are not included in this release yet (build from source).
            Docs: https://github.com/s4ngwoo/youtube-playlist-downloader#readme
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
