name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  rust:
    name: Rust (check, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri.conf.json externalBin requires this path at build-script time;
      # unit tests do not invoke the binary, so a stub is enough for CI.
      - name: Prepare yt-dlp sidecar stub
        run: |
          mkdir -p bin
          printf '%s\n' '#!/bin/sh' 'echo "yt-dlp CI stub"' 'exit 0' \
            > bin/yt-dlp-x86_64-unknown-linux-gnu
          chmod +x bin/yt-dlp-x86_64-unknown-linux-gnu

      - name: cargo check
        run: cargo check

      # Fail on any clippy warning (style + correctness).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
